# Même version en local, dans travail/ et en CI : le minimum du programme de la
# formation (Rust ≥ 1.90, `rust-version` des manifestes). Ne la monter que pour un
# besoin avéré, en même temps que `rust-version`.
[toolchain]
channel = "1.90.0"
# `rust-analyzer` : l'extension VS Code cherche le serveur dans la toolchain épinglée
components = ["rustfmt", "clippy", "rust-analyzer"]
profile = "minimal"
