[package]
name = "wind-tunnel"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
description = "Soufflerie numérique — projet fil rouge de la formation « Rust pour le calcul scientifique »"
license = "CC-BY-NC-SA-4.0"

# Une « feature » par étape, chaînée à la précédente : activer `step3` active
# step0 à step3. Les tests de chaque étape sont conditionnés à la sienne, si bien
# que `cargo test` ne montre que ce qui est déjà au programme du stagiaire.
# `cargo xtask goto <n>` ne fait rien d'autre que réécrire la ligne `default`.
#
# `step13` est la **sentinelle** : c'est l'étape suivant la dernière implémentée
# (`LAST_STEP` dans `xtask/src/main.rs` vaut 12, et `goto 13` est refusé). Aucun code
# n'en dépend. Elle sert à écrire `not(feature = "step13")` sur les avertissements
# collatéraux des trous de la dernière étape : la condition est vraie dans un dossier de
# travail, fausse ici, donc l'attribut n'y cache jamais rien. C'est aussi le nom réservé
# au bonus suivant — un écoulement à sillage, en variables `ψ`–`ω` ; le jour où il sera
# écrit, `step14` deviendra la sentinelle. Voir `docs/AVANCEMENT.md`
# § « Avertissements dans travail/ ».
[features]
default = ["step13"]
step0 = []
step1 = ["step0"]
step2 = ["step1"]
step3 = ["step2"]
step4 = ["step3"]
step5 = ["step4"]
step6 = ["step5"]
step7 = ["step6"]
step8 = ["step7"]
step9 = ["step8"]
step10 = ["step9"]
step11 = ["step10"]
step12 = ["step11"]
step13 = ["step12"]

[workspace]
members = ["xtask", "mpi", "design"]
# Le dossier de travail engendré est un projet à part entière : cargo doit
# l'ignorer tant qu'on travaille depuis la racine du corrigé.
#
# `mpi` et `design` restent dans les *membres* pour partager Cargo.lock et être visibles
# de `cargo metadata` / rust-analyzer, mais un workspace non virtuel comme celui-ci ne
# construit par défaut que le paquet racine (`workspace_default_members`) : `cargo build`,
# `cargo test` et `cargo clippy --all-features` sans `-p`/`--workspace` ne touchent donc
# jamais `mpi/` et restent verts sur une machine sans MPI. Le bâtir explicitement :
# `cargo build -p wind-tunnel-mpi` (ou `--manifest-path mpi/Cargo.toml`).
#
# `design` profite de la même propriété pour une autre raison : c'est l'exercice de
# conception (bonus de l'étape 2), dont le fichier source est **vide** dans un dossier de
# travail. Ses tests ne compilent donc pas tant que le stagiaire n'a pas écrit les types,
# et c'est voulu — hors du groupe par défaut, cet état rouge ne gêne rien.
# `cargo test -p wind-tunnel-design` pour le lancer.
exclude = ["travail"]

[dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
rayon = "1"

[profile.release]
debug = true

# `faer` ne sert qu'à l'exemple `stream_faer` (l'extension « ne réinventez pas la roue »
# de l'étape 12). Dépendance *optionnelle* plutôt que de développement : son arbre est
# gros, et `cargo test` — la boucle de travail du stagiaire — n'a aucune raison de le
# compiler. `cargo run --features faer --example stream_faer` le fait, et lui seul.
[dependencies.faer]
version = "0.24"
optional = true

[[example]]
name = "stream_faer"
required-features = ["faer"]
