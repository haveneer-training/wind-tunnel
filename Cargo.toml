[package]
name = "wind-tunnel"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
description = "Soufflerie numérique — projet fil rouge de la formation « Rust pour le calcul scientifique »"
license = "CC-BY-NC-SA-4.0"

# Une « feature » par étape, chaînée à la précédente : activer `step3` active
# step0 à step3. Les tests de chaque étape sont conditionnés à la sienne, si bien
# que `cargo test` ne montre que ce qui est déjà au programme du stagiaire.
# `cargo xtask goto <n>` ne fait rien d'autre que réécrire la ligne `default`.
[features]
default = ["step8"]
step0 = []
step1 = ["step0"]
step2 = ["step1"]
step3 = ["step2"]
step4 = ["step3"]
step5 = ["step4"]
step6 = ["step5"]
step7 = ["step6"]
step8 = ["step7"]

[workspace]
members = ["xtask"]
# Le dossier de travail engendré est un projet à part entière : cargo doit
# l'ignorer tant qu'on travaille depuis la racine du corrigé.
exclude = ["travail"]

[dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
debug = true
